name: Publish installer to R2

on:
  push:
    branches:
      - main
    paths:
      - "warp-3xui.sh"
      - "cloudflare-install.sh"
      - ".github/workflows/publish-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-warp3xui-r2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      R2_BUCKET: xray-manager-private
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v6
      - name: Validate
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing $name"; exit 1; }
          done
          bash -n warp-3xui.sh
          bash -n cloudflare-install.sh
          shellcheck warp-3xui.sh cloudflare-install.sh
      - name: Prepare objects
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p output
          install -m 755 warp-3xui.sh output/warp-3xui.sh
          install -m 755 cloudflare-install.sh output/warp3xui-install.sh
          sha256sum output/warp-3xui.sh | awk '{print $1}' > output/warp-3xui.sha256
      - name: Upload to private R2
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          upload() {
            aws s3 cp "$1" "s3://${R2_BUCKET}/$2" \
              --endpoint-url "$endpoint" \
              --content-type "$3" \
              --cache-control "$4" \
              --only-show-errors
          }
          upload output/warp-3xui.sh releases/warp3xui/warp-3xui.sh \
            "text/x-shellscript; charset=utf-8" no-store
          upload output/warp-3xui.sha256 releases/warp3xui/warp-3xui.sha256 \
            "text/plain; charset=utf-8" no-store
          upload output/warp3xui-install.sh public/warp3xui-install.sh \
            "text/x-shellscript; charset=utf-8" "public, max-age=300"
      - name: Verify objects
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for key in \
            public/warp3xui-install.sh \
            releases/warp3xui/warp-3xui.sh \
            releases/warp3xui/warp-3xui.sha256
          do
            aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
              --endpoint-url "$endpoint" >/dev/null
            echo "Verified: $key"
          done
