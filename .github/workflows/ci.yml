name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install checks
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: ShellCheck
        run: shellcheck warp-3xui.sh tests/static.sh
      - name: Static tests
        run: bash tests/static.sh
