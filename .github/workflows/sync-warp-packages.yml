name: Sync official WARP packages to R2

on:
  push:
    branches:
      - main
    paths:
      - "warp-3xui.sh"
      - ".github/workflows/sync-warp-packages.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-warp-packages-r2
  cancel-in-progress: false

jobs:
  fetch-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        codename:
          - bookworm
          - trixie
          - jammy
          - noble
          - resolute
    steps:
      - name: Fetch and verify official package
        shell: bash
        env:
          CODENAME: ${{ matrix.codename }}
        run: |
          set -Eeuo pipefail
          packages_url="https://pkg.cloudflareclient.com/dists/${CODENAME}/main/binary-amd64/Packages"
          mkdir -p "output/${CODENAME}"
          curl --fail --silent --show-error --location --retry 3 \
            "${packages_url}" -o packages.txt
          stanza="$(awk 'BEGIN { RS=""; FS="\n" } $1 == "Package: cloudflare-warp" { print; exit }' packages.txt)"
          [[ -n "${stanza}" ]] || { echo "::error::No cloudflare-warp package for ${CODENAME}"; exit 1; }
          version="$(sed -n 's/^Version: //p' <<<"${stanza}" | head -n1)"
          filename="$(sed -n 's/^Filename: //p' <<<"${stanza}" | head -n1)"
          expected="$(sed -n 's/^SHA256: //p' <<<"${stanza}" | head -n1)"
          [[ "${version}" =~ ^[0-9][0-9A-Za-z.+:~-]*$ ]]
          [[ "${filename}" =~ ^pool/[0-9A-Za-z._/+~-]+/cloudflare-warp_[0-9A-Za-z._:+~-]+_amd64\.deb$ ]]
          [[ "${expected}" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --silent --show-error --location --retry 3 \
            "https://pkg.cloudflareclient.com/${filename}" \
            -o "output/${CODENAME}/cloudflare-warp.deb"
          actual="$(sha256sum "output/${CODENAME}/cloudflare-warp.deb" | awk '{print $1}')"
          [[ "${actual}" == "${expected}" ]] || { echo "::error::SHA256 mismatch"; exit 1; }
          printf '%s\n' "${expected}" > "output/${CODENAME}/cloudflare-warp.sha256"
          printf '%s\n' "${version}" > "output/${CODENAME}/version"
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-warp-${{ matrix.codename }}-amd64
          path: output/${{ matrix.codename }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: fetch-deb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_BUCKET: warp-3xui-private
      ARCHIVE_KEEP_VERSIONS: "2"
      WORKER_BASE_URL: https://warp-3xui-download.xinian5216.workers.dev
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - name: Validate credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing ${name}"; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: cloudflare-warp-*-amd64
          path: output
      - name: Publish versioned archives and latest pointers
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          [[ "${ARCHIVE_KEEP_VERSIONS}" =~ ^[1-9][0-9]*$ ]]

          retain_recent_archives() {
            local codename="$1" archive_root prefixes_output prefix version delete_prefix index
            local -a versions=()
            [[ "${codename}" =~ ^[a-z0-9][a-z0-9-]*$ ]]
            archive_root="packages/cloudflare-warp/deb/${codename}/amd64/archive/"

            prefixes_output="$(
              aws s3api list-objects-v2 \
                --bucket "${R2_BUCKET}" \
                --prefix "${archive_root}" \
                --delimiter / \
                --query 'CommonPrefixes[].Prefix' \
                --output text \
                --endpoint-url "${endpoint}"
            )"
            while IFS= read -r prefix; do
              [[ -n "${prefix}" && "${prefix}" != "None" ]] || continue
              [[ "${prefix}" == "${archive_root}"* ]] \
                || { echo "::error::Unexpected archive prefix: ${prefix}"; exit 1; }
              version="${prefix#"${archive_root}"}"
              version="${version%/}"
              [[ "${version}" =~ ^[0-9][0-9A-Za-z.+:~-]*$ ]]
              [[ "${prefix}" == "${archive_root}${version}/" ]] \
                || { echo "::error::Unsafe archive prefix: ${prefix}"; exit 1; }
              versions+=("${version}")
            done < <(tr '\t' '\n' <<<"${prefixes_output}")

            ((${#versions[@]} > ARCHIVE_KEEP_VERSIONS)) || return 0
            mapfile -t versions < <(printf '%s\n' "${versions[@]}" | LC_ALL=C sort -Vru)
            for ((index = ARCHIVE_KEEP_VERSIONS; index < ${#versions[@]}; index++)); do
              version="${versions[index]}"
              delete_prefix="${archive_root}${version}/"
              [[ "${delete_prefix}" == "packages/cloudflare-warp/deb/${codename}/amd64/archive/${version}/" ]]
              echo "Removing expired archive: ${codename} ${version}"
              aws s3 rm "s3://${R2_BUCKET}/${delete_prefix}" \
                --recursive \
                --endpoint-url "${endpoint}" \
                --only-show-errors
            done
          }

          for artifact_dir in output/cloudflare-warp-*-amd64; do
            codename="${artifact_dir#output/cloudflare-warp-}"
            codename="${codename%-amd64}"
            version="$(tr -d '[:space:]' < "${artifact_dir}/version")"
            [[ "${codename}" =~ ^[a-z0-9][a-z0-9-]*$ ]]
            [[ "${version}" =~ ^[0-9][0-9A-Za-z.+:~-]*$ ]]
            latest="packages/cloudflare-warp/deb/${codename}/amd64/latest"
            archive="packages/cloudflare-warp/deb/${codename}/amd64/archive/${version}"
            aws s3 cp "${artifact_dir}/cloudflare-warp.deb" \
              "s3://${R2_BUCKET}/${archive}/cloudflare-warp.deb" \
              --endpoint-url "${endpoint}" \
              --content-type application/vnd.debian.binary-package \
              --cache-control private,no-store --only-show-errors
            aws s3 cp "${artifact_dir}/cloudflare-warp.sha256" \
              "s3://${R2_BUCKET}/${archive}/cloudflare-warp.sha256" \
              --endpoint-url "${endpoint}" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control private,no-store --only-show-errors
            aws s3 cp "${artifact_dir}/version" \
              "s3://${R2_BUCKET}/${archive}/version" \
              --endpoint-url "${endpoint}" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control private,no-store --only-show-errors

            # Update the tiny pointer only after the immutable archive is complete.
            aws s3 cp "${artifact_dir}/version" \
              "s3://${R2_BUCKET}/${latest}/version" \
              --endpoint-url "${endpoint}" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control private,no-store --only-show-errors
            aws s3api head-object --bucket "${R2_BUCKET}" \
              --key "${archive}/cloudflare-warp.deb" \
              --endpoint-url "${endpoint}" >/dev/null
            published_version="$(
              aws s3 cp "s3://${R2_BUCKET}/${latest}/version" - \
                --endpoint-url "${endpoint}" \
                --only-show-errors | tr -d '[:space:]'
            )"
            [[ "${published_version}" == "${version}" ]] \
              || { echo "::error::Latest pointer mismatch for ${codename}"; exit 1; }
            retain_recent_archives "${codename}"
            echo "Published ${codename} ${version}"
          done

      - name: Remove redundant latest package copies
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          layout_ready=0

          # Worker and Actions deploy independently. Keep compatibility copies
          # until the live Worker confirms it can follow latest/version.
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --location --head \
                --max-time 15 "${WORKER_BASE_URL%/}/install.sh" \
                | tr -d '\r' \
                | grep -Fqx 'x-warpm-package-layout: archive-pointer-v1'; then
              layout_ready=1
              break
            fi
            (( attempt == 18 )) || sleep 10
          done

          if (( layout_ready == 0 )); then
            echo "::warning::Worker pointer layout is not live yet; keeping redundant latest packages for compatibility. A later scheduled or manual run will remove them."
            exit 0
          fi

          for codename in bookworm trixie jammy noble resolute; do
            latest="packages/cloudflare-warp/deb/${codename}/amd64/latest"
            for filename in cloudflare-warp.deb cloudflare-warp.sha256; do
              key="${latest}/${filename}"
              [[ "${key}" == "packages/cloudflare-warp/deb/${codename}/amd64/latest/${filename}" ]]
              aws s3 rm "s3://${R2_BUCKET}/${key}" \
                --endpoint-url "${endpoint}" \
                --only-show-errors
            done
            echo "Removed redundant latest package copy: ${codename}"
          done
